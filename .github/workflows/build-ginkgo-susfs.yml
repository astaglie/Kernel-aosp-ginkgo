name: Build ginkgo kernel (LineageOS + SukiSU Ultra + SUSFS)

# Redmi Note 8 / 8T (ginkgo, willow). Kernel resmi LineageOS (lineage-24.0) +
# SukiSU-Ultra TERBARU + SUSFS v2.2.0 yang di-backport ke 4.14. Release string
# disamakan dengan kernel ROM: 4.14.357-openela-perf-g<12 hash commit>.
#
# Asal SUSFS: fs/susfs.c, susfs.h, susfs_def.h diambil dari FloppyKernel pada commit
# yang dikunci (86c833a1bbf4, backport SUSFS v2.2.0 untuk 4.14.357). Hook-hook di
# fs/, kernel/, mm/, security/ dan hook SukiSU untuk 4.14 ada di patch di bawah
# (gzip+base64). Patch dibuat terhadap lineage-24.0 commit 8aaa002bf; kalau ROM
# update dan patch tidak lagi menempel, workflow berhenti dengan pesan jelas.
#
# Diuji lokal (clang 18): build penuh sampai Image.gz lolos, release string persis
# 4.14.357-openela-perf-g8aaa002bfb7b, "susfs ... version: v2.2.0" dan SukiSU ada
# di dalam kernel. BELUM diuji: boot di HP, SUSFS berfungsi di runtime, dan
# workflow ini di GitHub Actions. Fitur sus_type / avd (SUSFS 2.2.1+) hanya stub.

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Cabang kernel LineageOS (lineage-24.0 = ROM terbaru)"
        default: "lineage-24.0"
      sukisu_ref:
        description: "Cabang SukiSU-Ultra"
        default: "builtin-new"

env:
  FLOPPY_SHA: 86c833a1bbf4e8676cbed693326c01c6a707eb84

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu flex bison bc \
            libssl-dev libelf-dev cpio lz4 zip dwarves

      - name: Fetch kernel (LineageOS)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_xiaomi_sm6125
          ref: ${{ inputs.kernel_ref }}
          path: kernel
          fetch-depth: 1

      - name: Fetch SukiSU-Ultra
        run: |
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra "$RUNNER_TEMP/sukisu"
          git -C "$RUNNER_TEMP/sukisu" checkout "${{ inputs.sukisu_ref }}"
          echo "SukiSU $(git -C "$RUNNER_TEMP/sukisu" rev-parse --short HEAD)"
          grep -q "KSU_SUSFS_INLINE_HOOK" "$RUNNER_TEMP/sukisu/kernel/Kconfig" \
            || { echo "SukiSU ref ini tidak punya KSU_SUSFS_INLINE_HOOK"; exit 1; }

      - name: Add SUSFS v2.2.0 (core from Floppy, hooks from patch)
        working-directory: kernel
        run: |
          B=https://raw.githubusercontent.com/FlopKernel-Series/flop_trinket-mi_kernel/$FLOPPY_SHA
          curl -fsSL "$B/fs/susfs.c"                -o fs/susfs.c
          curl -fsSL "$B/include/linux/susfs.h"     -o include/linux/susfs.h
          curl -fsSL "$B/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          python3 -I - <<'PYEOF'
          import pathlib
          p = pathlib.Path("fs/susfs.c"); t = p.read_text()
          # 1. drop Floppy's legacy-SukiSU key block (conflicts with SukiSU builtin-new)
          a = t.index("#if defined(CONFIG_KSU_SUKI) && defined(CONFIG_KSU_SUSFS)\n/* SukiSU legacy")
          b = t.index("#endif", t.index("EXPORT_SYMBOL(ksu_input_hook_key_false);")) + len("#endif")
          t = t[:a] + t[b:]
          # 2. susfs_ends_with() is needed by SukiSU, Floppy only has susfs_starts_with()
          m = "/* sus_path */\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
          assert t.count(m) == 1
          t = t.replace(m, "bool susfs_ends_with(const char *str, const char *suffix) {\n    size_t sl = strlen(str), xl = strlen(suffix);\n    return sl >= xl && !memcmp(str + sl - xl, suffix, xl);\n}\n\n" + m, 1)
          # 3. stubs for SukiSU's sepolicy patching (features of newer SUSFS)
          t += """
          /* Compat stubs: SUSFS 2.2.1+ sus_type / avd features are not in this backport. */
          int susfs_add_sus_type(const char *secctx, u32 type_value)
          {
          	return 0;
          }

          int susfs_add_sus_avd_allowed_by_type(u32 s_type, u32 t_type, u32 c_type, u32 orig_avd_allowed)
          {
          	return 0;
          }

          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          /* sus_path_uid_filter is newer than this backport: sus paths stay hidden from all non-su apps. */
          void susfs_parse_sus_path_app_strings(void)
          {
          }

          void susfs_set_sus_path_uid_filter(void __user **user_info)
          {
          }
          #endif
          """
          p.write_text(t)
          d = pathlib.Path("include/linux/susfs_def.h"); t = d.read_text()
          m = "#define CMD_SUSFS_ADD_SUS_PATH_LOOP 0x55553\n"
          assert t.count(m) == 1
          d.write_text(t.replace(m, m + "#ifndef CMD_SUSFS_SET_SUS_PATH_UID_FILTER\n#define CMD_SUSFS_SET_SUS_PATH_UID_FILTER 0x55554\n#endif\n"))
          h = pathlib.Path("include/linux/susfs.h"); t = h.read_text()
          m = "/* susfs_init */\nvoid susfs_init(void);"
          assert t.count(m) == 1
          h.write_text(t.replace(m, "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\nvoid susfs_parse_sus_path_app_strings(void);\nvoid susfs_set_sus_path_uid_filter(void __user **user_info);\n#endif\n\n/* string helpers used by SukiSU */\nbool susfs_starts_with(const char *str, const char *prefix);\nbool susfs_ends_with(const char *str, const char *suffix);\n\n" + m))
          PYEOF
          cat > "$RUNNER_TEMP/hooks.b64" <<'B64EOF'
          H4sICAU5/WoCA3N1c2ZzLWhvb2tzLnBhdGNoAOw8aXPbRpafqV/RTra0pERSvElZkWe0FuWwrMOr
