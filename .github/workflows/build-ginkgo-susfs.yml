      - name: Integrate SukiSU into the kernel tree
        working-directory: kernel
        run: |
          mkdir KernelSU
          (cd "$RUNNER_TEMP/sukisu" && tar --exclude=.git -cf - .) | tar -xf - -C KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -n kernelsu drivers/Makefile drivers/Kconfig

      - name: Configure (same fragments the ROM build uses)
        working-directory: kernel
        run: |
          MK="make O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"
          $MK vendor/trinket-perf_defconfig
          CF=arch/arm64/configs/vendor
          KCONFIG_CONFIG=out/.config scripts/kconfig/merge_config.sh -m -O out out/.config \
            $CF/xiaomi-trinket.config $CF/ginkgo.config
          scripts/config --file out/.config --disable LOCALVERSION_AUTO \
            --enable KSU --enable KSU_SUSFS \
            --enable KSU_SUSFS_SUS_PATH --enable KSU_SUSFS_SUS_MOUNT --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT --enable KSU_SUSFS_SUS_MAP \
            --disable KSU_SUSFS_PRIORITY_UID_FILTER
          $MK olddefconfig
          grep -E '^(# )?CONFIG_(KSU|LOCALVERSION)[A-Z_]*[= ]' out/.config
          for o in KSU KSU_SUSFS KSU_SUSFS_INLINE_HOOK KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_PATH; do
            grep -q "^CONFIG_$o=y" out/.config || { echo "CONFIG_$o tidak aktif"; exit 1; }
          done
          H=$(git rev-parse HEAD | cut -c1-12)
          LVC=$(sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"/\1/p' out/.config)
          KV=$(make -s kernelversion)
          echo "H=$H" >> "$GITHUB_ENV"
          echo "WANT_REL=${KV}${LVC}-g${H}" >> "$GITHUB_ENV"
          echo "release yang diharapkan: ${KV}${LVC}-g${H}"

      - name: Build Image.gz
        working-directory: kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip READELF=llvm-readelf \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION="-g$H" Image.gz
          REL="$(cat out/include/config/kernel.release)"
          echo "kernel release: $REL"
          [ "$REL" = "$WANT_REL" ] || { echo "release mismatch: $REL vs $WANT_REL"; exit 1; }

      - name: Verify SUSFS and SukiSU are compiled in
        run: |
          strings -a kernel/out/arch/arm64/boot/Image | grep -m1 'susfs is initialized' \
            || { echo "SUSFS tidak ikut ter-compile"; exit 1; }
          strings -a kernel/out/arch/arm64/boot/Image | grep -q 'com.sukisu.ultra' \
            || { echo "SukiSU tidak ikut ter-compile"; exit 1; }

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 "$RUNNER_TEMP/ak3"
          cat > "$RUNNER_TEMP/ak3/anykernel.sh" <<'AKEOF'
          # AnyKernel3 config for Redmi Note 8 / 8T (ginkgo, willow). Replaces only the kernel
          # Image.gz in the boot partition; the ramdisk is left untouched.
          # Variable names follow the current osm0sis/AnyKernel3 template (upper case).
          # Does NOT back up the stock boot image: save your own boot.img first.

          properties() { '
          kernel.string=Ginkgo LineageOS kernel with SukiSU Ultra (SUSFS v2.2.0, no KPM)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=ginkgo
          device.name2=willow
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          boot_attributes() {
          set_perm_recursive 0 0 755 644 $RAMDISK/*;
          set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
          }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          AKEOF
          cp kernel/out/arch/arm64/boot/Image.gz "$RUNNER_TEMP/ak3/Image.gz"
          cd "$RUNNER_TEMP/ak3"
          rm -rf .git .github README.md
          zip -r9 "$GITHUB_WORKSPACE/ginkgo-lineage-sukisu-susfs-$(date +%Y%m%d).zip" . -x '*.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: ginkgo-lineage-sukisu-susfs
          path: ginkgo-lineage-sukisu-susfs-*.zip
